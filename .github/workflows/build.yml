name: Android build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses >/dev/null
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Unpack source bundle
        run: |
          unzip -q RabbiStream-source.zip -d source
          cd source/RabbiStream
          gradle --no-daemon :app:assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RabbiStream-debug
          path: source/RabbiStream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
